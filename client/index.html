<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>CommuteGo — Discover Hidden Places, Meet Local Experts & Travel Together</title>
    <meta name="title" content="CommuteGo — Discover Hidden Places, Meet Local Experts & Travel Together" />
    <meta name="description" content="CommuteGo is India's premium travel platform for discovering hidden destinations, connecting with verified local buddies, and finding travel companions. Plan trips, explore the real India, travel together." />
    <meta name="keywords" content="CommuteGo, hidden destinations India, offbeat places India, local buddies India, travel matchmaking India, travel companions India, weekend getaways, trekking India, road trips India, photography spots India, verified local guides, travel community India" />
    <meta name="author" content="CommuteGo" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="rating" content="General" />
    <meta name="distribution" content="Global" />
    <meta name="revisit-after" content="3 days" />
    <meta name="language" content="English" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />

    <!-- Theme & Mobile -->
    <meta name="theme-color" content="#06B6D4" />
    <meta name="msapplication-TileColor" content="#06B6D4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CommuteGo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical & Manifest -->
    <link rel="canonical" href="https://commutego.in/" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CommuteGo" />
    <meta property="og:url" content="https://commutego.in/" />
    <meta property="og:title" content="CommuteGo — Discover Hidden Places, Meet Local Experts & Travel Together" />
    <meta property="og:description" content="India's premium travel platform for hidden destinations, verified local buddies, and travel matchmaking. Plan trips, find companions, and explore the real India." />
    <meta property="og:image" content="https://commutego.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CommuteGo — Discover Hidden Places in India" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://commutego.in/" />
    <meta name="twitter:title" content="CommuteGo — Discover Hidden Places, Meet Local Experts & Travel Together" />
    <meta name="twitter:description" content="India's premium travel platform for hidden destinations, verified local buddies, and travel matchmaking." />
    <meta name="twitter:image" content="https://commutego.in/og-image.jpg" />
    <meta name="twitter:image:alt" content="CommuteGo — Discover Hidden Places in India" />
    <meta name="twitter:site" content="@commutego" />
    <meta name="twitter:creator" content="@commutego" />

    <!--
      Google Search Console verification:
      Replace GOOGLE_SEARCH_CONSOLE_TOKEN below with the meta tag value
      Google gives you in Search Console → Settings → Ownership verification.
      Format: <meta name="google-site-verification" content="PASTE_TOKEN_HERE" />
    -->
    <meta name="google-site-verification" content="GOOGLE_SEARCH_CONSOLE_TOKEN" />

    <!-- Structured Data: Organization / Travel Agency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "CommuteGo",
      "url": "https://commutego.in",
      "logo": "https://commutego.in/logo.png",
      "description": "CommuteGo is India's premium travel platform for discovering hidden destinations, connecting with verified local buddies, and finding travel companions.",
      "image": "https://commutego.in/og-image.jpg",
      "sameAs": [
        "https://twitter.com/commutego",
        "https://www.instagram.com/commutego",
        "https://www.facebook.com/commutego"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "keshabdas2003@gmail.com",
        "availableLanguage": ["English", "Hindi"]
      },
      "areaServed": {
        "@type": "Country",
        "name": "India"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      }
    }
    </script>

    <!-- Structured Data: Website with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CommuteGo",
      "url": "https://commutego.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://commutego.in/hidden-destinations?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- AdSense (left in place, not an SEO concern) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  </head>
  <body className="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
